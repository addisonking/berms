name: Format & Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  swift-format:
    name: swift-format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting and lint
        run: ./scripts/lint.sh
      - name: Check build identity across Git workflows
        run: python3 scripts/test-build-identity.py
